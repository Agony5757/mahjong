<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日麻 — 牌谱复现</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="nav-links">
    <a href="/">人机对战</a>
    <a href="/ai_battle">4 AI 对战</a>
    <a href="/replay" class="active">牌谱复现</a>
</nav>

<div class="top-bar">
    <div class="table-meta">
        <span class="round-info">东1局</span>
        <span class="honba">本场 0</span>
        <span class="riichibo">供托 0</span>
        <span class="tiles-left">牌山 70</span>
    </div>
    <div class="dora-bar">
        <span>宝牌:</span>
        <span class="dora-tiles" id="doraTiles"></span>
    </div>
</div>

<div class="game-container">
    <div class="game-main">
        <div class="replay-controls">
            <button class="speed-btn" onclick="window._replayClient.stepBackward()">⏮ 上一步</button>
            <button class="speed-btn" id="btnPlay" onclick="window._replayClient.play()">▶ 播放</button>
            <button class="speed-btn" onclick="window._replayClient.stepForward()">⏭ 下一步</button>
            <div class="replay-timeline" onclick="onTimelineClick(event)">
                <div class="replay-progress" id="timelineProgress"></div>
                <input type="range" id="timelineSlider" min="0" max="1" value="0"
                    style="position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%"
                    oninput="window._replayClient.seekTo(parseInt(this.value))">
            </div>
            <span class="text-dim" style="font-size:13px" id="stepCounter">0 / 0</span>
            <span style="flex:0 0 1px; background:rgba(255,255,255,0.1); height:24px"></span>
            <button class="speed-btn" onclick="window._replayClient.setSpeed(1500)">慢</button>
            <button class="speed-btn" onclick="window._replayClient.setSpeed(600)">中</button>
            <button class="speed-btn" onclick="window._replayClient.setSpeed(150)">快</button>
        </div>
        <canvas id="mahjongCanvas" width="1200" height="780"></canvas>
        <div class="status-msg" id="statusMsg">选择内置牌谱或上传天凤 XML 开始复现</div>
    </div>

    <aside class="side-panel">
        <div class="panel-card">
            <h3>当前事件</h3>
            <div id="stepInfo" class="text-dim" style="font-size:13px">未加载</div>
        </div>
        <div class="panel-card">
            <h3>累计点数</h3>
            <div class="scoreboard" id="scoreboard"></div>
        </div>
        <div class="panel-card">
            <h3>局选择</h3>
            <div class="hansou-stepper" id="kyokuList"></div>
        </div>
    </aside>
</div>

<!-- Landing -->
<div class="landing" id="landingOverlay">
    <h1>牌谱复现</h1>
    <p class="subtitle">加载天凤 XML 牌谱，按真实事件逐步播放</p>
    <div class="mode-cards">
        <div class="mode-card" onclick="loadBuiltin()">
            <div class="icon">📚</div>
            <h2>内置示例</h2>
            <p>选择内置牌谱（CI 测试集）</p>
        </div>
        <div class="mode-card" onclick="document.getElementById('fileInput').click()">
            <div class="icon">📤</div>
            <h2>上传 XML</h2>
            <p>从本地 .xml/.txt 牌谱加载</p>
        </div>
    </div>
    <input type="file" id="fileInput" accept=".xml,.txt" style="display:none" onchange="onFileSelected(event)">
    <div id="builtinList" class="mt-16" style="width:100%; max-height:240px; overflow-y:auto; display:none"></div>
</div>

<script src="/static/js/renderer.js"></script>
<script src="/static/js/replay.js"></script>
<script>
    window._replayClient = null;

    function ensureClient() {
        if (window._replayClient) return window._replayClient;
        const c = new window.ReplayClient('mahjongCanvas');
        c.resize();
        window.addEventListener('resize', () => { c.resize(); c._renderStep(); });
        window._replayClient = c;
        return c;
    }

    async function loadBuiltin() {
        const c = ensureClient();
        const files = await c.listBuiltinPaipu();
        if (!files.length) {
            alert('未找到内置牌谱。请确认 paipuxmls/ 目录存在。');
            return;
        }
        const list = document.getElementById('builtinList');
        list.style.display = 'block';
        list.innerHTML = files.slice(0, 30).map(f =>
            `<div class="result-row" style="cursor:pointer" onclick="onBuiltinClick('${f}')">${f}</div>`
        ).join('');
    }

    async function onBuiltinClick(name) {
        const c = ensureClient();
        document.getElementById('statusMsg').textContent = '加载中: ' + name;
        try {
            const n = await c.loadBuiltinPaipu(name);
            document.getElementById('landingOverlay').style.display = 'none';
            document.getElementById('statusMsg').textContent = `已加载 ${n} 个事件`;
        } catch (e) {
            alert('加载失败: ' + e.message);
        }
    }

    async function onFileSelected(ev) {
        const file = ev.target.files[0];
        if (!file) return;
        const c = ensureClient();
        const text = await file.text();
        document.getElementById('statusMsg').textContent = '解析中...';
        try {
            const n = await c.loadFromXML(text);
            document.getElementById('landingOverlay').style.display = 'none';
            document.getElementById('statusMsg').textContent = `已加载 ${n} 个事件`;
        } catch (e) {
            alert('解析失败: ' + e.message);
        }
    }

    function onTimelineClick(e) {
        // The slider is already overlaid; click handled by oninput.
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (!window._replayClient) return;
        if (e.key === 'ArrowLeft') window._replayClient.stepBackward();
        else if (e.key === 'ArrowRight') window._replayClient.stepForward();
        else if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            window._replayClient.play();
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('mahjongCanvas');
        const ctx = canvas.getContext('2d');
        window.MahjongRenderer.resizeCanvasToContainer(canvas, { maxWidth: 2200, maxHeightRatio: 1.10 });
        window.MahjongRenderer.renderSplash(ctx, canvas.width, canvas.height, '牌谱复现', '加载内置牌谱或上传天凤 XML');
    });
</script>
</body>
</html>
