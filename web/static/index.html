<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日麻 — 人机对战</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="nav-links">
    <a href="/" class="active">人机对战</a>
    <a href="/ai_battle">4 AI 对战</a>
    <a href="/replay">牌谱复现</a>
</nav>

<div class="top-bar" id="topBar">
    <div class="table-meta">
        <span class="round-info">东1局</span>
        <span class="honba">本场 0</span>
        <span class="riichibo">供托 0</span>
        <span class="tiles-left">牌山 70</span>
    </div>
    <div class="dora-bar">
        <span>宝牌:</span>
        <span class="dora-tiles" id="doraTiles"></span>
    </div>
</div>

<div class="game-container">
    <div class="game-main">
        <canvas id="mahjongCanvas" width="1200" height="780"></canvas>
        <div class="status-msg" id="statusMsg">点击下方按钮开始新游戏</div>
        <div class="action-panel" id="actionPanel">
            <button class="action-btn btn-confirm" id="btnNewGame">新建游戏</button>
        </div>
    </div>

    <aside class="side-panel">
        <div class="panel-card">
            <h3>累计点数</h3>
            <div class="scoreboard" id="scoreboard"></div>
        </div>
        <div class="panel-card">
            <h3>半庄进度</h3>
            <div class="hansou-stepper" id="hansouStepper"></div>
        </div>
        <div class="panel-card">
            <h3>对局日志</h3>
            <div id="logContent" style="max-height:240px; overflow-y:auto; font-size:12px"></div>
        </div>
    </aside>
</div>

<!-- Landing Overlay -->
<div class="landing" id="landingOverlay">
    <h1>日麻</h1>
    <p class="subtitle">4人立直麻将 · 人机对战</p>
    <div class="mode-cards">
        <div class="mode-card" onclick="startHumanAI()">
            <div class="icon">🎴</div>
            <h2>人机对战</h2>
            <p>你 vs 3个 AI（随机策略）</p>
        </div>
    </div>
    <div class="text-dim mt-16" style="font-size:13px">
        <details>
            <summary>高级选项</summary>
            <div style="margin-top:12px; text-align:left; display:inline-block">
                <label style="display:block; margin-bottom:8px">
                    AI 模型:
                    <select id="aiModelSelect" style="margin-left:8px; padding:4px; background:#16213e; color:#eee; border:1px solid #555; border-radius:4px">
                        <option value="random">随机 AI（默认）</option>
                    </select>
                </label>
                <label style="display:block; margin-bottom:8px">
                    赛制:
                    <select id="maxRoundSelect" style="margin-left:8px; padding:4px; background:#16213e; color:#eee; border:1px solid #555; border-radius:4px">
                        <option value="0">东风战</option>
                        <option value="1" selected>半庄</option>
                    </select>
                </label>
                <label style="display:block; margin-bottom:8px">
                    随机种子:
                    <input type="number" id="seedInput" placeholder="留空=随机" style="margin-left:8px; padding:4px; background:#16213e; color:#eee; border:1px solid #555; border-radius:4px; width:100px">
                </label>
            </div>
        </details>
    </div>
</div>

<script src="/static/js/renderer.js"></script>
<script src="/static/js/game_core.js"></script>
<script>
    let game = null;

    function startHumanAI() {
        const aiModel = document.getElementById('aiModelSelect').value === 'random' ? null : document.getElementById('aiModelSelect').value;
        const seedVal = document.getElementById('seedInput').value;
        const seed = seedVal ? parseInt(seedVal) : null;
        const maxRound = parseInt(document.getElementById('maxRoundSelect').value);

        document.getElementById('landingOverlay').style.display = 'none';
        document.getElementById('btnNewGame').style.display = 'none';

        game = new MahjongGame('mahjongCanvas');
        game.resize();

        game.canvas.addEventListener('click', (e) => game._onCanvasClick(e));

        window.addEventListener('resize', () => {
            game.resize();
            game._render();
        });

        game.newGame('human_ai', aiModel, seed, maxRound).catch(err => {
            alert('启动失败: ' + err.message);
        });
    }
</script>
</body>
</html>
